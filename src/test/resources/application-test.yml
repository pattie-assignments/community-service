spring:
  datasource:
    url: jdbc:h2:mem:amumal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: true

  flyway:
    enabled: true

app:
  upload:
    base-dir: ./uploads
  seed:
    test-user-count: 0
  cookie:
    secure: false

jwt:

spring:
  task:
    scheduling:
      enabled: false

  datasource:
    url: jdbc:h2:mem:amumal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: simple # 메모리 기반 단순 캐시

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: true

  flyway:
    enabled: true

app:
  upload:
    base-dir: ./uploads
  seed:
    test-user-count: 0
  cookie:
    secure: false

jwt:
  secret: ${JWT_SECRET:test-only-jwt-secret-key-should-be-overridden-32chars}
  access-token-exp-seconds: 300
  refresh-token-exp-seconds: 12096000

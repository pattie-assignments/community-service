server:
  port: 3000
  servlet:
    context-path: /v1

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:amumal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true} # Valkey Serverless는 TLS 강제

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  profiles:
    active: development
    include: local # 개발자 개인 로컬 오버라이드를 활성 프로필과 무관하게 항상 덮어쓴다.

  cache:
    type: redis # Redis/Valkey를 캐시 저장소로 사용

app:
  upload:
    base-dir: ./uploads
  stock-sync:
    base-url: ${MARKET_DATA_SERVICE_BASE_URL:http://localhost:8081}
    batch-size: ${STOCK_SYNC_BATCH_SIZE:500}
    fixed-delay-ms: ${STOCK_SYNC_FIXED_DELAY_MS:300000}
  seed:
    test-user-count: ${TEST_USER_COUNT:20}
    test-user-password: ${TEST_USER_PASSWORD:Password1!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  cookie:
    secure: false

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: 3W8i2bTUFAf+rQtb6SV01OHnNEpqlntH/wfO770lw/gm3n2onNxHNNtbik6mNux7aNlMD0jsZHzdE2mYZe8vlA==
  access-token-exp-seconds: 300
  refresh-token-exp-seconds: 12096000

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health

  endpoint:
    health:
      show-details: never # 상태만 공개
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState # 외부 시스템 장애가 전체로 이어지지 않게

name: Update GitOps Image Tag

on:
  workflow_run:
    workflows: [ "Push Docker Image to GHCR" ]
    types:
      - completed

    # main 브랜치에서 실행된 이미지 Push 워크플로만 배포 대상으로 처리
    branches:
      - main

permissions:
  contents: read

# 동시에 여러 번 실행되어 Manifest 저장소에서 충돌하는 것 방지
concurrency:
  group: update-gitops-manifest
  cancel-in-progress: false

env:
  GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
  GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH }}
  GITOPS_VALUES_FILE: ${{ vars.GITOPS_VALUES_FILE }}

  GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
  GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}

jobs:
  update-gitops:
    name: Update Helm image tag

    # GHCR 이미지 Push 워크플로가 성공한 경우에만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-26.04

    steps:
      # Argo CD가 바라보는 Helm Manifest 저장소 checkout
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      # values.yaml의 이미지 태그를 GHCR에 Push한 커밋 SHA로 변경
      # 애플리케이션의 image.tag만 변경하여 사이드카 등 다른 이미지 태그가 변경되는 것을 방지
      - name: Update Helm image tag
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ ! -f "$GITOPS_VALUES_FILE" ]; then
            echo "values.yaml 파일을 찾을 수 없습니다: $GITOPS_VALUES_FILE"
            exit 1
          fi

          if ! yq -e '.image.tag != null' "$GITOPS_VALUES_FILE" > /dev/null; then
            echo "image.tag 항목을 찾을 수 없습니다: $GITOPS_VALUES_FILE"
            exit 1
          fi

          yq -i '.image.tag = strenv(IMAGE_TAG)' "$GITOPS_VALUES_FILE"

          echo "변경할 이미지 태그: $IMAGE_TAG"
          git diff -- "$GITOPS_VALUES_FILE"

      # 변경된 Manifest를 GitOps 저장소에 커밋
      - name: Commit and push manifest
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          git add "$GITOPS_VALUES_FILE"

          # 기존 태그와 같다면 커밋하지 않고 정상 종료
          if git diff --cached --quiet; then
            echo "이미 동일한 이미지 태그가 설정되어 있습니다."
            exit 0
          fi

          SHORT_IMAGE_TAG="${IMAGE_TAG:0:12}"

          git commit \
            -m "chore(deploy): update image tag to ${SHORT_IMAGE_TAG}"

          git pull --rebase origin "$GITOPS_BRANCH"
          git push origin "HEAD:$GITOPS_BRANCH"